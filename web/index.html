<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Afro-Centric Digital Discovery Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen font-sans text-gray-800">

  <header class="bg-emerald-900 text-white py-10 px-6 shadow-md">
    <div class="max-w-6xl mx-auto text-center">
      <h1 class="text-4xl font-bold tracking-tight">Afro-Centric Digital Discovery Hub</h1>
      <p class="mt-2 text-emerald-200">Exploring tech platforms, archives, and web apps across the African diaspora.</p>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="flex flex-col md:flex-row gap-4 justify-between items-center mb-8">
      <div class="relative w-full md:w-1/2">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-gray-400"></i>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search by title, keywords, or description..." 
          class="w-full pl-10 pr-4 py-2.5 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-600 bg-white shadow-sm"
        >
      </div>

      <div class="w-full md:w-1/3">
        <select 
          id="categorySelect" 
          class="w-full py-2.5 px-3 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-emerald-600 bg-white shadow-sm"
        >
          <option value="ALL">All Categories</option>
          <option value="Literature & Publishing">Literature & Publishing</option>
          <option value="Mobile & Web Apps">Mobile & Web Apps</option>
          <option value="Culture & Heritage">Culture & Heritage</option>
          <option value="Education & EdTech">Education & EdTech</option>
          <option value="Community & Social">Community & Social</option>
          <option value="Fintech & E-Commerce">Fintech & E-Commerce</option>
        </select>
      </div>
    </div>

    <div class="flex justify-between items-center mb-4 text-sm text-gray-600">
      <span id="resultsCount">Loading records from Firebase...</span>
    </div>

    <div id="cardsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div class="p-6 bg-white rounded-xl shadow-sm border border-gray-100 animate-pulse h-48"></div>
      <div class="p-6 bg-white rounded-xl shadow-sm border border-gray-100 animate-pulse h-48"></div>
      <div class="p-6 bg-white rounded-xl shadow-sm border border-gray-100 animate-pulse h-48"></div>
    </div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
